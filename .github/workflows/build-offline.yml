name: Offline Maven Build

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/build-offline.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/build-offline.yml'

jobs:
  prime-cache:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prime dependencies
        run: ./mvnw -B -DskipTests dependency:go-offline
      - name: Print resolved dependencies
        run: ./mvnw -B -DskipTests -Poffline-ready help:evaluate -Dexpression=project.dependencies
      - name: Archive Maven repository
        run: |
          tar -C ~/.m2 -c repository | zstd -T0 > m2-cache-${{ github.sha }}.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: m2-cache
          path: m2-cache-${{ github.sha }}.tar.zst

  build-offline:
    needs: prime-cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Djava.net.preferIPv4Stack=true
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: m2-cache
      - name: Extract Maven repository
        run: |
          mkdir -p ~/.m2
          tar --use-compress-program=unzstd -xf m2-cache-*.tar.zst -C ~/.m2
      - name: Offline package build
        run: ./mvnw -q -o -DskipTests package
      - name: Start application
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          echo $! > app.pid
          sleep 7
      - name: Curl upstox balance
        run: |
          curl -i --max-time 5 http://localhost:8080/ops/upstox-balance > curl.log 2>&1 || true
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: offline-logs
          path: |
            app.log
            curl.log
      - name: Stop application
        if: always()
        run: |
          kill $(cat app.pid) || true
