name: Offline Maven Build

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/build-offline.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/build-offline.yml'

jobs:
  prime-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: List modules
        run: ls -1 */pom.xml || true
      - name: Show local repository
        run: ./apps/api/mvnw -q -Poffline-ready help:effective-settings | sed -n '/<localRepository>/,/<\/localRepository>/p'
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-
      - name: Prime dependencies
        run: |
          ./apps/api/mvnw -B -DskipTests -Poffline-ready dependency:go-offline
          ./apps/api/mvnw -B -DskipTests -Poffline-ready package
      - name: Verify required artifacts
        run: |
          ls -la ~/.m2/repository/io/netty/netty-common/4.1.109.Final/
          ls -la ~/.m2/repository/io/netty/netty-transport/4.1.109.Final/
          ls -la ~/.m2/repository/io/netty/netty-codec-http/4.1.109.Final/
          ls -la ~/.m2/repository/com/squareup/okhttp3/okhttp/4.12.0/
          ls -la ~/.m2/repository/io/reactivex/rxjava3/rxjava/3.1.8/
          ls -la ~/.m2/repository/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.23/
          ls -la ~/.m2/repository/net/bytebuddy/byte-buddy/1.14.13/
      - name: Upload Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: m2-cache
          path: ~/.m2/repository
          if-no-files-found: error
          retention-days: 5

  build-offline:
    needs: prime-cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAVEN_OPTS: -Djava.net.preferIPv4Stack=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: m2-cache
          path: ~/.m2/repository
      - name: Show local repository
        run: ./apps/api/mvnw -q -Poffline-ready help:effective-settings | sed -n '/<localRepository>/,/<\/localRepository>/p'
      - name: Verify required artifacts
        run: |
          ls -la ~/.m2/repository/io/netty/netty-common/4.1.109.Final/
          ls -la ~/.m2/repository/io/netty/netty-transport/4.1.109.Final/
          ls -la ~/.m2/repository/io/netty/netty-codec-http/4.1.109.Final/
          ls -la ~/.m2/repository/com/squareup/okhttp3/okhttp/4.12.0/
          ls -la ~/.m2/repository/io/reactivex/rxjava3/rxjava/3.1.8/
          ls -la ~/.m2/repository/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.23/
          ls -la ~/.m2/repository/net/bytebuddy/byte-buddy/1.14.13/
      - name: Offline package build
        run: ./apps/api/mvnw -q -o -Poffline-ready -DskipTests package
      - name: Start application
        run: |
          nohup java -jar apps/api/target/*.jar > app.log 2>&1 &
          echo $! > app.pid
          sleep 7
      - name: Probe endpoint
        run: |
          curl -i --max-time 5 http://localhost:8080/signals/live | head -n 5 > curl.log || \
          curl -i --max-time 5 http://localhost:8080/ops/upstox-balance > curl.log
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: offline-logs
          path: |
            app.log
            curl.log
      - name: Stop application
        if: always()
        run: kill $(cat app.pid) || true
