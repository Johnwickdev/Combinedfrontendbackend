<app-side-rail></app-side-rail>
<div class="dashboard">
  <div class="shell">
    <app-topbar></app-topbar>
    <div class="auth-pill" *ngIf="connected; else loginTpl">
      <span class="tick">✅</span>
      <span>Token: Connected — expires in {{ formatRemaining() }}</span>
      <span class="refresh" (click)="refresh()">🔄</span>
    </div>
    <ng-template #loginTpl>
      <button class="login-btn" (click)="login()">Login with Upstox</button>
    </ng-template>
    <div class="main">
      <div class="left-col">
        <app-asset-header></app-asset-header>

        <div class="panel price-panel">
          <div class="price-value">
            {{ (futLtp$ | async) === null ? '—' : ((futLtp$ | async) | number:'1.2-2') }}
          </div>
          <small [ngClass]="(mode$ | async)==='LIVE' ? 'dot-live' : 'dot-influx'">
            {{ mode$ | async }}
          </small>
          <small>Last tick {{ lastTickAge$ | async }}s ago</small>
          <div class="muted">24h <span class="rise">+0.68%</span></div>
        </div>

        <div class="metrics">
          <app-metric-card *ngFor="let m of metrics" [title]="m.title" [value]="m.value"></app-metric-card>
        </div>

        <div class="bottom">
          <app-donut-score [value]="97"></app-donut-score>
          <app-trust-bar [value]="88"></app-trust-bar>
        </div>
      </div>

      <div class="right-col">
        <app-candle-panel></app-candle-panel>
        <app-sector-trades></app-sector-trades>
      </div>
    </div>
  </div>
</div>
